name: Episode State Card
description: Read-only workflow component for displaying canonical episode state
status: API_STABILIZATION

component:
  name: EpisodeStateCard
  path: components/workflow/episode-state-card.tsx
  type: display
  category: workflow

props:
  - name: variant
    type: EpisodeStateCardVariant
    required: true
    description: Visual variant (default, blocked, human-review-required, approved, published, unavailable)

canonical_props:
  - name: channelName
    type: string
    required: true
    description: Channel name (e.g., "Wealth Decoded")

  - name: title
    type: string
    required: true
    description: Episode title

  - name: workflowState
    type: string
    required: true
    description: Technical workflow state identifier

  - name: humanReviewStatus
    type: HumanReviewStatus
    required: true (for available variants)
    description: Current human review status

presentation_props:
  - name: episodeNumber
    type: number | null
    required: false
    description: Episode sequence number

  - name: workflowStateLabel
    type: string
    required: false
    description: Custom label for current workflow state

  - name: lastDecision
    type: EpisodeStateDecision | null
    required: false
    description: Last validated human decision

  - name: blockers
    type: EpisodeStateBlocker[]
    required: false
    description: List of blocking conditions

  - name: nextExpectedState
    type: string | null
    required: false
    description: Expected next workflow state

  - name: nextAuthorizedAction
    type: string | null
    required: false
    description: Human-readable next action

  - name: youtubeVideoId
    type: string
    required: false
    description: YouTube video ID for published episodes

  - name: publishedAt
    type: string
    required: false
    description: Published timestamp ISO8601

  - name: canonicalSource
    type: string
    required: false
    description: Source system identifier

  - name: manifestVersion
    type: string
    required: false
    description: Version of canonical manifest

  - name: unavailableReason
    type: string
    required: false
    description: Reason for unavailable state (unavailable variant only)

layout_props:
  - name: reduceMotion
    type: boolean
    required: false
    default: false
    description: Lab demo toggle for prefers-reduced-motion override

  - name: className
    type: string
    required: false
    description: Tailwind CSS class override

variants:
  - name: default
    description: Normal workflow state with decision history
    props:
      variant: default

  - name: blocked
    description: Episode blocked by conditions
    props:
      variant: blocked

  - name: human-review-required
    description: Awaiting human judgment
    props:
      variant: human-review-required

  - name: approved
    description: Decision approved, ready to proceed
    props:
      variant: approved

  - name: published
    description: Episode live on YouTube
    props:
      variant: published

  - name: unavailable
    description: Manifest could not be loaded
    props:
      variant: unavailable

